version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Run fmt, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  diagrams:
    desc: Render research/*.d2 diagrams to SVG in docs/
    cmds:
      - mkdir -p docs
      - for f in research/*.d2; do d2 "$f" "docs/$(basename "${f%.d2}").svg"; done
      # d2 writes 0600; the docs server needs world-readable files.
      - chmod 644 docs/*.svg

  docs:build:
    desc: Build documentation (markdown to HTML) into docs/
    deps: [diagrams]
    cmds:
      - task-plus md2html --file index.md --dst docs
      - task-plus md2html --file README.md --dst docs
      - task-plus md2html --file CHANGELOG.md --dst docs
      - task-plus md2html --file ROADMAP.md --dst docs
      - for f in research/*.md; do task-plus md2html --file "$f" --dst docs --label Research; done

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf docs/
      - go clean -testcache
